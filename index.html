<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card UI DEsign</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="profile-card">
        <div class="image">
            <img src="rohit....jpg" alt="" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">Rohit Raj</span>
            <span class="job">Student</span>
        </div>

        <div class="media-buttons">
            <a href="# " style="background:#1877f2;" class="link">
                <i class='bx bxl-facebook'></i>
            </a>

            <a href="#" style="background:#000;" class="link">
                <i class='bx bxl-github'></i>
            </a>

            <a href="#" style="background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);" class="link">
                <i class='bx bxl-instagram'></i>
            </a>

            <a href="https://www.linkedin.com/in/rohit-raj-343a92340" target="_blank" style="background:#0a66c2;" class="link">
                <i class='bx bxl-linkedin'></i>
            </a>

        </div>

        <div class="buttons">
            <button class="button">Follow Me</button>
            <button class="button">Message</button>
        </div>


        <div class="analytics">
            <div class="data">
                <i class='bx bx-heart'></i>
                <span class="number">60k</span>
            </div>

            <div class="data">
                <i class='bx bx-message-rounded'></i>
                <span class="number">20k</span>
            </div>

            <div class="data">
                <i class='bx bx-share'></i>
                <span class="number">12k</span>
            </div>
        </div>
    </div>
</body>

</html>
